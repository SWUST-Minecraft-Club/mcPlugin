# 主菜单配置（文本用 MiniMessage 格式：https://docs.advntr.dev/minimessage/format.html）
# 改完用 /cd reload 热重载

menu:
  # 菜单标题
  title: "<dark_gray>主菜单</dark_gray>"

  # 打开方式
  open:
    # 手持时钟右键（对着空气或方块都行）
    clock-right-click: true
    # 对着可交互方块（箱子、门等）右键时是否也打开主菜单；默认不抢方块交互
    clock-right-click-on-block: true
    # 潜行时是否仍然触发（默认也允许，避免"蹲着点没反应"）
    clock-while-sneaking: true

  # 第 1 行第 2 格：当前时间（固定功能位）
  clock:
    material: CLOCK
    name: "<yellow>当前时间</yellow>"
    # 悬停文本，{time} 会替换成下面格式化的时间
    line: "<gray>当前时间：<white>{time}</white></gray>"
    format: "yyyy-MM-dd HH:mm:ss"
    # 时区偏移：东 8 区 = 8
    zone-offset-hours: 8
    hint: "<dark_gray>固定功能位 · 点击无效</dark_gray>"

  # 非固定空位（第 2 行、第 6 行以及功能区以外的其它格子）：白色染色玻璃板
  # 属于“非固定位置功能物品”，功能插件可以用自定义位置占用
  filler:
    material: WHITE_STAINED_GLASS_PANE
    name: "<gray> </gray>"

  # 第 4 行第 1 格 / 第 9 格：翻页箭头（固定功能位）
  paging:
    previous-material: ARROW
    next-material: ARROW
    previous-name: "<yellow>上一页</yellow>"
    next-name: "<yellow>下一页</yellow>"
    page-line: "<gray>第 <white>{page}</white>/<white>{pages}</white> 页</gray>"
    first-page: "<dark_gray>已经是第一页</dark_gray>"
    last-page: "<dark_gray>已经是最后一页</dark_gray>"

  # 功能物品的附加提示
  feature:
    clickable-hint: "<dark_gray>点击使用</dark_gray>"
    not-clickable-hint: "<dark_gray>点击无效</dark_gray>"
    # 自定义位置冲突时追加在悬停文本最后一行
    conflict-hint: "<red>该功能插件位置不可用，已自动归到功能区</red>"

messages:
  no-permission: "<red>你没有权限执行该命令。</red>"
  players-only: "<red>该命令只能由玩家执行。</red>"
  reloaded: "<green>主菜单配置已重载。</green>"
