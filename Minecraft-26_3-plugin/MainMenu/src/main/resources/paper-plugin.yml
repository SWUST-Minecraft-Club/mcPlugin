# Paper 插件描述文件
# bootstrapper 用于在服务端启动早期（注册表构建阶段）注册主菜单 dialog 与内置数据包，
# 这是把按钮挂到 ESC 菜单上的唯一时机。
name: MainMenu
version: '${version}'
main: com.example.mainmenu.MainMenuPlugin
bootstrapper: com.example.mainmenu.MainMenuBootstrap
api-version: '26.3'
description: 主菜单：ESC 菜单按钮 / /cd / 手持时钟右键 打开 6×9 功能菜单
authors: [zhou-BZDDX]
website: https://github.com/zhou-BZDDX/mcPlugin

permissions:
  mainmenu.use:
    description: 允许打开主菜单
    default: true
  mainmenu.reload:
    description: 允许使用 /cd reload、/cd debug
    default: op
  mainmenu.admin:
    description: 允许进入功能插件管理界面
    default: op
