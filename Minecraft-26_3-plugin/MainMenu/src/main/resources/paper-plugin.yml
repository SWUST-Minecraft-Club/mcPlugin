# Paper / Folia 插件描述文件（Folia 沿用 paper-plugin.yml）
# bootstrapper 用于在服务端启动早期（注册表构建阶段）注册主菜单 dialog 与内置数据包，
# 这是把按钮挂到 ESC 菜单上的唯一时机。
name: MainMenu
version: '${version}'
main: com.example.mainmenu.MainMenuPlugin
bootstrapper: com.example.mainmenu.MainMenuBootstrap
api-version: '26.3'
# 声明支持 Folia；没有这一项的插件会被 Folia 拒绝加载
folia-supported: true
description: 主菜单：原生 YAML 方块手机、物品应用桌面与管理界面
authors: [zhou-BZDDX]
website: https://github.com/zhou-BZDDX/mcPlugin

dependencies:
  server:
    ArcMenu:
      load: BEFORE
      required: false
      join-classpath: true

permissions:
  mainmenu.use:
    description: 允许打开主菜单
    default: true
  mainmenu.reload:
    description: 允许使用 /cd reload、/cd debug
    default: op
  mainmenu.admin:
    description: 允许管理主菜单功能、排序与固定位置
    default: op
