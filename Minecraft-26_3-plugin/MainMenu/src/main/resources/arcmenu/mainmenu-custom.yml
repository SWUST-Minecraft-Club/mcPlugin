# Editable native ArcMenu phone UI. Existing server files are never overwritten.
# Change layout, labels, models, tooltips and actions here; use /cd reload to apply.
# Palette: edit the first &phone-<color> anchor; its *phone-<color> aliases follow.
# META values are supplied by MainMenu. See the MainMenu README for the data contract.
# Frontend offsets include measured depth/rectangle compensation; backend uses root coordinates.
