name: YudreamMinecraftServer
main: online.yudream.minecraft.bukkit.YudreamMinecraftPlugin
version: '${version}'
api-version: 1.13
# 声明支持 Folia；调度器由兼容层在运行期按服务端类型选择（Folia / Bukkit）
folia-supported: true
author: YuDream
description: Reports player join, quit and AFK activity to YuDream Admin, standalone or as a proxy backend sensor.

commands:
  yudreammc:
    description: Manage YuDream Minecraft server bridge.
    usage: /<command> <mode|reload|status|sync|queue|playtime|syncplaytime|help>
    aliases: [ymc]
    permission: yudreammc.admin

permissions:
  yudreammc.admin:
    description: Allows managing the YuDream Minecraft bridge.
    default: op
