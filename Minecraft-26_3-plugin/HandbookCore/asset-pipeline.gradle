// 原 API 继续使用 520×288 逻辑画布；客户端输出为 56.25%。九种 ascent 补齐原生 9px 行高内的偏移。
tasks.register('compileCompactFonts') {
    dependsOn 'compileBookTexture', 'compileBookFont', 'compileVanillaIcons', 'compileBookmarks'
    def sources = ['book', 'font', 'icon', 'bookmark'].collect { layout.buildDirectory.dir("generated/${it}-resources") }
    inputs.files(sources)
    inputs.file('src/main/resources/ce-pack/handbookcore/configuration/images.yml')
    inputs.file('assets/book-v2.png')
    outputs.dir(layout.buildDirectory.dir('generated/compact-resources'))
    doLast {
        def output = layout.buildDirectory.dir('generated/compact-resources').get().asFile
        delete output
        def assetRoot = 'ce-pack/handbookcore/resourcepack/assets'
        def roots = sources.collect { new File(it.get().asFile, assetRoot) }
        def fonts = [:]
        roots.each { root -> fileTree(new File(root, 'handbookcore/font')).matching { include '*.json' }.files.sort().each { f ->
            if (!(f.name in ['space.json','fallback.json'])) fonts[f.name.replace('.json', '')] = new JsonSlurper().parse(f)
        } }
        fonts.paper = [providers: (0..<3).collect { row -> [type:'bitmap',file:"handbookcore:font/paper-${row}.png",
            height:96,ascent:7-row*96,chars:[new String(((0..<4).collect { 0xe000+row*4+it } as int[]),0,4)]] }]
        // 先将整图编译到整数 GUI 单元，再切片，避免 70.3125px 字形拼接产生黑缝。
        def paper = new BufferedImage(560,324,BufferedImage.TYPE_INT_ARGB)
        def graphics = paper.createGraphics()
        graphics.setRenderingHint(RenderingHints.KEY_INTERPOLATION,RenderingHints.VALUE_INTERPOLATION_BILINEAR)
        graphics.drawImage(ImageIO.read(file('assets/book-v2.png')),0,0,560,324,null); graphics.dispose()
        def paperTextures = new File(output,"${assetRoot}/handbookcore/textures/font")
        paperTextures.mkdirs()
        for (int row=0;row<3;row++) ImageIO.write(paper.getSubimage(0,row*108,560,108),'png',new File(paperTextures,"compact-paper-${row}.png"))
        def iconMetrics = new Properties()
        new File(layout.buildDirectory.dir('generated/icon-resources').get().asFile,'vanilla-icons.properties').withInputStream { iconMetrics.load(it) }
        def iconByCp = iconMetrics.values().collectEntries { value -> def d=value.split(','); [(d[0] as int):d] }
        def metrics = new TreeMap<String,String>()
        def shared = new HashSet<String>()
        fonts.each { name, font ->
            font.providers.findAll { it.type == 'bitmap' && !(name in ['body','heading','button']) }.each { provider ->
                int height = provider.height as int, compact = Math.max(1,Math.round(height*0.5625f))
                def grid = provider.chars.collect { it.codePoints().toArray() }
                def fileParts = provider.file.split(':',2)
                def texture = roots.collect { new File(it, "${fileParts[0]}/textures/${fileParts[1]}") }.find { it.isFile() }
                def png = texture == null ? null : ImageIO.read(texture)
                for (int row=0;row<grid.size();row++) for (int col=0;col<grid[row].length;col++) {
                    int cp=grid[row][col]; if (cp==0) continue
                    int original, resized
                    if (png != null) {
                        int cw=png.width.intdiv(grid[0].length), ch=png.height.intdiv(grid.size()), right=0
                        for (int x=0;x<cw;x++) for (int y=0;y<ch;y++)
                            if ((png.getRGB(col*cw+x,row*ch+y)>>>24)!=0) right=Math.max(right,x+1)
                        original=Math.round(right*height/(float)ch)+1; resized=Math.round(right*compact/(float)ch)+1
                        if (name=='paper') {
                            int tileRow=(cp-0xe000).intdiv(4), edge=0
                            for (int x=0;x<140;x++) for (int y=0;y<108;y++)
                                if ((paper.getRGB(col*140+x,tileRow*108+y)>>>24)!=0) edge=Math.max(edge,x+1)
                            resized=Math.round(edge*0.5f)+1
                        }
                    } else {
                        def data=iconByCp[cp]
                        if (data==null) throw new GradleException("缺少缩放图标指标：${name}/${cp}")
                        original=Math.round(((data[1] as int)-1)*height/32.0f)+1
                        resized=Math.round(((data[1] as int)-1)*compact/32.0f)+1
                    }
                    metrics["handbookcore:${name}/${cp}"]="${original},${resized}"
                }
            }
            for (int offset=0;offset<9;offset++) {
                // 未收录字符由输出器保留原字体处理；紧凑字体不再枚举整份 Unicode 回退。
                def selected = name in ['body','heading','button'] ? font.providers.findAll { it.type=='bitmap' } : font.providers
                def providers=selected.collect { p ->
                    def copy=new LinkedHashMap(p)
                    if (p.type=='bitmap') {
                        copy.height=Math.max(1,Math.round((p.height as int)*0.5625f))
                        copy.ascent=Math.min(copy.height as int,7-Math.round((7-(p.ascent as int))*0.5625f)-offset)
                        if (name=='paper') copy.file=(p.file as String).replace('paper-', 'compact-paper-')
                        if (name in ['body','heading','button']) {
                            String id="handbookcore:compact/shared/h${copy.height}_a${copy.ascent}"
                            if (shared.add(id)) {
                                def common=new File(output,"${assetRoot}/handbookcore/font/${id.substring(13)}.json")
                                common.parentFile.mkdirs(); common.text=JsonOutput.toJson([providers:[copy]])
                            }
                            copy=[type:'reference',id:id]
                        }
                    }
                    copy
                }
                def target=new File(output,"${assetRoot}/handbookcore/font/compact/handbookcore/${name}/${offset}.json")
                target.parentFile.mkdirs(); target.text=JsonOutput.toJson([providers:providers])
            }
        }
        new File(output,'compact-glyphs.properties').text=metrics.collect { k,v -> "${k.replace(':','\\:')}=${v}" }.join('\n')+'\n'
    }
}
// 图像生成器提供完整书本和同画风的书签图集；构建只切图与缩放，不重新拼画控件。
tasks.register('compileBookmarks') {
    inputs.file('assets/bookmarks-source.png')
    outputs.dir(layout.buildDirectory.dir('generated/bookmark-resources'))
    doLast {
        def root = layout.buildDirectory.dir('generated/bookmark-resources/ce-pack/handbookcore/resourcepack/assets/handbookcore').get().asFile
        new File(root, 'textures/font').mkdirs(); new File(root, 'font').mkdirs()
        def source = ImageIO.read(file('assets/bookmarks-source.png'))
        def atlas = new BufferedImage(336,128,BufferedImage.TYPE_INT_ARGB)
        def g = atlas.createGraphics()
        g.setRenderingHint(RenderingHints.KEY_INTERPOLATION,RenderingHints.VALUE_INTERPOLATION_BILINEAR)
        for (int row=0; row<2; row++) for (int col=0; col<4; col++) {
            int x0=col*source.width.intdiv(4), x1=(col+1)*source.width.intdiv(4)
            int y0=row*source.height.intdiv(2), y1=(row+1)*source.height.intdiv(2)
            int left=x1, right=x0, top=y1, bottom=y0
            for (int x=x0; x<x1; x++) for (int y=y0; y<y1; y++) if ((source.getRGB(x,y)>>>24)>48) {
                left=Math.min(left,x); right=Math.max(right,x+1); top=Math.min(top,y); bottom=Math.max(bottom,y+1)
            }
            if (right<=left || bottom<=top) throw new GradleException('书签图集缺少单元')
            g.drawImage(source,col*84,row*64,(col+1)*84,(row+1)*64,left,top,right,bottom,null)
        }
        g.dispose(); ImageIO.write(atlas,'png',new File(root,'textures/font/bookmarks.png'))
        new File(root,'font/bookmarks.json').text = JsonOutput.toJson([providers:[[type:'bitmap',
            file:'handbookcore:font/bookmarks.png',height:32,ascent:7,chars:['\ue200\ue201\ue202\ue203','\ue204\ue205\ue206\ue207']]]])
        def hits = []
        [30,52,82,176,42].eachWithIndex { width,index ->
            def hit = new BufferedImage(width-1,9,BufferedImage.TYPE_INT_ARGB)
            for (int x=0; x<width-1; x++) for (int y=0; y<9; y++) hit.setRGB(x,y,0x01ffffff)
            ImageIO.write(hit,'png',new File(root,"textures/font/hit-${width}.png"))
            hits.add([type:'bitmap',file:"handbookcore:font/hit-${width}.png",height:9,ascent:7,chars:[String.valueOf((char)(0xe220+index))]])
        }
        new File(root,'font/hit.json').text = JsonOutput.toJson([providers:hits])
    }
}
