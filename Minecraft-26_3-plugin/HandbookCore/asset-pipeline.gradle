import groovy.json.JsonSlurper
import groovy.json.JsonOutput
import java.awt.*
import java.awt.image.BufferedImage
import javax.imageio.ImageIO
import java.util.zip.ZipFile

def generated = layout.buildDirectory.dir('generated/book-resources')
def clientSource = rootProject.layout.projectDirectory.file('.gradle/handbook-assets/client-26.3.jar')
tasks.register('downloadIconSource') {
    outputs.file(clientSource)
    doLast {
        def target = clientSource.asFile
        target.parentFile.mkdirs()
        def expected = 'e877b6a07acd633fb3bb475002175cec036e7b87'
        if (!target.exists()) {
            new URI("https://piston-data.mojang.com/v1/objects/${expected}/client.jar").toURL().withInputStream { input ->
                target.withOutputStream { output -> output << input }
            }
        }
        def digest = java.security.MessageDigest.getInstance('SHA-1')
        target.withInputStream { input -> byte[] b = new byte[65536]; int n; while ((n = input.read(b)) > 0) digest.update(b, 0, n) }
        if (digest.digest().encodeHex().toString() != expected) {
            target.delete()
            throw new GradleException('Minecraft 图标索引源校验失败，请重新构建')
        }
    }
}
tasks.register('compileBookFont') {
    inputs.file('assets/fonts/DroidSansFallbackFull.ttf')
    inputs.file('assets/fonts/DejaVuSansMono.ttf')
    inputs.files('assets/fonts/LICENSE.txt', 'assets/fonts/DejaVu-LICENSE.txt')
    outputs.dir(layout.buildDirectory.dir('generated/font-resources'))
    doLast {
        def root = layout.buildDirectory.dir('generated/font-resources').get().asFile
        def target = new File(root, 'ce-pack/handbookcore/resourcepack/assets/handbookcore')
        new File(target, 'textures/font').mkdirs(); new File(target, 'font').mkdirs()
        def font = Font.createFont(Font.TRUETYPE_FONT, file('assets/fonts/DroidSansFallbackFull.ttf')).deriveFont(14.0f)
        def latin = Font.createFont(Font.TRUETYPE_FONT, file('assets/fonts/DejaVuSansMono.ttf')).deriveFont(14.0f)
        def atlas = new BufferedImage(4096, 4096, BufferedImage.TYPE_INT_ARGB)
        def g = atlas.createGraphics(); g.setFont(font); g.setColor(Color.WHITE)
        g.setRenderingHint(RenderingHints.KEY_TEXT_ANTIALIASING, RenderingHints.VALUE_TEXT_ANTIALIAS_OFF)
        def supported = new BitSet(65536)
        def rows = []
        for (int y = 0; y < 256; y++) {
            def chars = new StringBuilder()
            for (int x = 0; x < 256; x++) {
                int cp = y * 256 + x
                def selected = font.canDisplay(cp) ? font : latin.canDisplay(cp) ? latin : null
                if (cp >= 32 && !(cp >= 0xd800 && cp <= 0xdfff) && selected != null) {
                    supported.set(cp); chars.append((char)cp)
                    g.setFont(selected)
                    String value = String.valueOf((char)cp)
                    int inset = Math.max(0, (16-g.getFontMetrics().stringWidth(value)).intdiv(2))
                    g.drawString(value, x * 16 + inset, y * 16 + 13)
                    // 最低透明度的锚点使 bitmap advance 稳定；不依赖客户端字体测量。
                    atlas.setRGB(x * 16 + 15, y * 16 + 15, 0x01ffffff)
                } else chars.append((char)0)
            }
            rows.add(chars.toString())
        }
        g.dispose()
        // 紧排支持字符，保留 16px 原始字形细节；不对中文笔画做预先降采样。
        def packedRows=[]; int packedCount=supported.cardinality(), packedHeight=((packedCount+127).intdiv(128))*16
        def packed=new BufferedImage(2048,packedHeight,BufferedImage.TYPE_INT_ARGB)
        def pg=packed.createGraphics(); int glyphIndex=0; def packedLine=new StringBuilder()
        for (int cp=supported.nextSetBit(0);cp>=0;cp=supported.nextSetBit(cp+1)) {
            int tx=(glyphIndex%128)*16, ty=glyphIndex.intdiv(128)*16, sx=(cp%256)*16, sy=cp.intdiv(256)*16
            pg.drawImage(atlas,tx,ty,tx+16,ty+16,sx,sy,sx+16,sy+16,null)
            packedLine.append((char)cp); glyphIndex++
            if (glyphIndex%128==0) { packedRows.add(packedLine.toString()); packedLine=new StringBuilder() }
        }
        if (packedLine.length()>0) { while(packedLine.length()<128) packedLine.append((char)0); packedRows.add(packedLine.toString()) }
        pg.dispose(); rows=packedRows
        ImageIO.write(packed, 'png', new File(target, 'textures/font/glyphs.png'))
        new File(root, 'book-font.bin').bytes = supported.toByteArray()
        ['body':[12,9], 'heading':[14,13], 'button':[12,5]].each { name, size ->
            new File(target, "font/${name}.json").text = JsonOutput.toJson([providers:[
                [type:'bitmap', file:'handbookcore:font/glyphs.png', height:size[0], ascent:size[1], chars:rows]
            ]])
        }
        // 未收录字符直接使用这一份字体；避免每个 FontSet 都枚举整份 Unicode。
        new File(target,'font/fallback.json').text=JsonOutput.toJson([providers:[
            [type:'unihex',hex_file:'minecraft:font/unifont.zip',size_overrides:[[from:'\u0000',to:'\udbff\udfff',left:0,right:15]]]
        ]])
        copy { from 'assets/fonts/LICENSE.txt'; into new File(target, 'licenses'); rename { 'Droid-Apache-2.0.txt' } }
        copy { from 'assets/fonts/DejaVu-LICENSE.txt'; into new File(target, 'licenses') }
    }
}
tasks.register('compileVanillaIcons') {
    dependsOn 'downloadIconSource'
    inputs.file(clientSource)
    outputs.dir(layout.buildDirectory.dir('generated/icon-resources'))
    doLast {
        def root = layout.buildDirectory.dir('generated/icon-resources').get().asFile
        def target = new File(root, 'ce-pack/handbookcore/resourcepack/assets/handbookcore/font/icons.json')
        target.parentFile.mkdirs()
        def icons = []; def mappings = new StringBuilder(); int next = 0xe010
        def parser = new JsonSlurper()
        new ZipFile(clientSource.asFile).withCloseable { zip ->
            def readJson = { String path -> def entry = zip.getEntry(path); entry == null ? null : parser.parse(zip.getInputStream(entry)) }
            def textureFor
            textureFor = { String model, Set<String> visited ->
                if (!visited.add(model)) return null
                String path = model.replace('minecraft:', '')
                def json = readJson("assets/minecraft/models/${path}.json")
                if (json == null) return null
                def textures = new LinkedHashMap(json.textures ?: [:])
                def chosen = textures.layer0 ?: textures.all ?: textures.top ?: textures.side ?: textures.values().find { !(it as String).startsWith('#') }
                if (chosen != null && !(chosen as String).startsWith('#')) return chosen as String
                return json.parent == null ? null : textureFor(json.parent as String, visited)
            }
            def findModel
            findModel = { node ->
                if (!(node instanceof Map)) return null
                if (node.type == 'minecraft:model' || node.type == 'model') return node.model
                for (def key : ['model', 'on_true', 'on_false', 'fallback']) {
                    def value = findModel(node[key]); if (value != null) return value
                }
                if (node.models instanceof List) for (def child : node.models) { def value = findModel(child); if (value != null) return value }
                return null
            }
            zip.entries().toList().findAll { it.name.startsWith('assets/minecraft/items/') && it.name.endsWith('.json') }.sort { it.name }.each { entry ->
                String id = entry.name.substring('assets/minecraft/items/'.length(), entry.name.length() - 5)
                String model = findModel(readJson(entry.name)?.model)
                String texture = model == null ? null : textureFor(model, new HashSet<String>())
                if (texture == null || !texture.startsWith('minecraft:')) return
                def textureEntry = zip.getEntry('assets/minecraft/textures/' + texture.substring(10) + '.png')
                if (textureEntry == null) return
                def image = ImageIO.read(zip.getInputStream(textureEntry))
                // 动画纹理也以第一帧展示，交互预览仍使用原生 ItemStack 模型。
                if (image.height != image.width) return
                icons.add([id:id, cp:next++, image:image])
            }
        }
        // 每个 bitmap provider 都分配完整 Unicode 索引表。将缩略图合为一张图集，
        // 避免 1508 个图标 × 多种基线各自分配空表；每个图标仍保留独立码点。
        int columns = 64, cell = 32, count = icons.size(), rowCount = (count + columns - 1).intdiv(columns)
        def atlas = new BufferedImage(columns * cell, rowCount * cell, BufferedImage.TYPE_INT_ARGB)
        def graphics = atlas.createGraphics()
        graphics.setRenderingHint(RenderingHints.KEY_INTERPOLATION, RenderingHints.VALUE_INTERPOLATION_NEAREST_NEIGHBOR)
        def rows = []; def line = new StringBuilder()
        icons.eachWithIndex { icon, index ->
            int col = index % columns, row = index.intdiv(columns)
            graphics.drawImage(icon.image, col * cell, row * cell, cell, cell, null)
            int right = 0, left = cell
            for (int x = 0; x < cell; x++) for (int y = 0; y < cell; y++)
                if ((atlas.getRGB(col * cell + x, row * cell + y) >>> 24) != 0) {
                    right = Math.max(right, x + 1); left = Math.min(left, x)
                }
            mappings.append("${icon.id}=${icon.cp},${right+1},${left},${Math.round(right*0.5f)+1},${Math.round(left*0.5f)}\n")
            line.appendCodePoint(icon.cp)
            if ((index + 1) % columns == 0) { rows.add(line.toString()); line = new StringBuilder() }
        }
        if (line.length() > 0) { while (line.length() < columns) line.append((char)0); rows.add(line.toString()) }
        graphics.dispose()
        def texture = new File(root, 'ce-pack/handbookcore/resourcepack/assets/handbookcore/textures/font/vanilla-icons.png')
        texture.parentFile.mkdirs(); ImageIO.write(atlas, 'png', texture)
        target.text = JsonOutput.toJson([providers:[[type:'bitmap',file:'handbookcore:font/vanilla-icons.png',height:32,ascent:7,chars:rows]]])
        new File(target.parentFile,'icons_small.json').text = JsonOutput.toJson([providers:[
            [type:'bitmap',file:'handbookcore:font/vanilla-icons.png',height:16,ascent:-1,chars:rows]]])
        new File(root, 'vanilla-icons.properties').text = mappings.toString()
        logger.lifecycle("已生成 ${count} 个原版图标缩略图，共用一个 bitmap provider")
    }
}
