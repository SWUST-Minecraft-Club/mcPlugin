// 图像生成器提供完整书本和同画风的书签图集；构建只切图与缩放，不重新拼画控件。
tasks.register('compileBookmarks') {
    inputs.file('assets/bookmarks-source.png')
    outputs.dir(layout.buildDirectory.dir('generated/bookmark-resources'))
    doLast {
        def root = layout.buildDirectory.dir('generated/bookmark-resources/ce-pack/handbookcore/resourcepack/assets/handbookcore').get().asFile
        new File(root, 'textures/font').mkdirs(); new File(root, 'font').mkdirs()
        def source = ImageIO.read(file('assets/bookmarks-source.png'))
        def atlas = new BufferedImage(336,128,BufferedImage.TYPE_INT_ARGB)
        def g = atlas.createGraphics()
        g.setRenderingHint(RenderingHints.KEY_INTERPOLATION,RenderingHints.VALUE_INTERPOLATION_BILINEAR)
        for (int row=0; row<2; row++) for (int col=0; col<4; col++) {
            int x0=col*source.width.intdiv(4), x1=(col+1)*source.width.intdiv(4)
            int y0=row*source.height.intdiv(2), y1=(row+1)*source.height.intdiv(2)
            int left=x1, right=x0, top=y1, bottom=y0
            for (int x=x0; x<x1; x++) for (int y=y0; y<y1; y++) if ((source.getRGB(x,y)>>>24)>48) {
                left=Math.min(left,x); right=Math.max(right,x+1); top=Math.min(top,y); bottom=Math.max(bottom,y+1)
            }
            if (right<=left || bottom<=top) throw new GradleException('书签图集缺少单元')
            g.drawImage(source,col*84,row*64,(col+1)*84,(row+1)*64,left,top,right,bottom,null)
        }
        g.dispose(); ImageIO.write(atlas,'png',new File(root,'textures/font/bookmarks.png'))
        new File(root,'font/bookmarks.json').text = JsonOutput.toJson([providers:[[type:'bitmap',
            file:'handbookcore:font/bookmarks.png',height:32,ascent:7,chars:['\ue200\ue201\ue202\ue203','\ue204\ue205\ue206\ue207']]]])
        def hits = []
        [30,52,82,176,42].eachWithIndex { width,index ->
            def hit = new BufferedImage(width-1,9,BufferedImage.TYPE_INT_ARGB)
            for (int x=0; x<width-1; x++) for (int y=0; y<9; y++) hit.setRGB(x,y,0x01ffffff)
            ImageIO.write(hit,'png',new File(root,"textures/font/hit-${width}.png"))
            hits.add([type:'bitmap',file:"handbookcore:font/hit-${width}.png",height:9,ascent:7,chars:[String.valueOf((char)(0xe220+index))]])
        }
        new File(root,'font/hit.json').text = JsonOutput.toJson([providers:hits])
    }
}
