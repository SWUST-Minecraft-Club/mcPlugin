name: Wallet
version: '${version}'
main: com.example.wallet.WalletPlugin
api-version: '26.3'
# 声明支持 Folia；没有这一项的插件会被 Folia 拒绝加载
folia-supported: true
description: 主菜单里的钱包：货币种类、余额与流水（数据与操作全部走 YuDream 官网），并为后续插件提供钱包 API
authors: [zhou-BZDDX]
website: https://github.com/zhou-BZDDX/mcPlugin

# 软依赖：没有 MainMenu 时插件正常加载并对外提供 WalletApi，只是不注册菜单功能
dependencies:
  server:
    MainMenu:
      load: BEFORE
      required: false

permissions:
  wallet.admin:
    description: 允许打开钱包管理界面（玩家货币 / 货币类型）
    default: op
  wallet.adjust:
    description: 允许使用 /walletin 与 /walletout 调整在线玩家货币
    default: op
