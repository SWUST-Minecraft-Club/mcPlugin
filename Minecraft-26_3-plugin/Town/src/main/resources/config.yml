# ============================================================================
# Town 小镇系统配置
# 全部键都有兜底值；热重载 /town admin reload 或 /town reload。
# 文案全部为 MiniMessage（<gold> 等标签直接生效）。
# ============================================================================

# ---------------------------- 建筑迁移 ----------------------------
relocation:
  max-volume: 65536
  blocks-per-tick: 256
  preview-blocks: 2048
  draft-seconds: 600
  base-price: 20
  price-per-block: 0.05
  hall-surcharge: 100

market:
  max-quantity: 100000
  max-listings-per-player: 32

# ---------------------------- 小镇基础 ----------------------------
town:
  # 成立所需最低人数（含镇长本人）。筹备中的小镇达到该人数后才能「成立」扣费。
  min-members: 1
  # 小镇成员上限（含镇长）；0 = 不限。
  max-members: 0
  # 小镇名称长度与字符限制。
  name-min-length: 2
  name-max-length: 12
  # 小镇名允许的字符（Java 正则）。
  name-regex: "[0-9A-Za-z_\\u4e00-\\u9fa5]+"
  # 筹备中超时自动解散（小时）；0 = 不超时。
  pending-expire-hours: 72
  # 邀请有效期（分钟）。
  invite-expire-minutes: 30

# ---------------------------- 经济（Wallet / Vault）----------------------------
economy:
  # wallet：现有 Wallet 多币种；vault：从 Vault 注册的 Economy 服务读取。
  # 修改来源后重启服务端；不会自动切换、迁移余额或将旧交易发送到其他来源。
  provider: "wallet"
  # 仅 Wallet 使用的 asset code；留空 = 自动取第一个启用货币。
  # Vault 使用经济插件的单一货币，以提供者独立币种保存，忽略此项。
  currency: ""

# ---------------------------- 成立与圈地 ----------------------------
founding:
  # 成立费用（扣费发生在人数达标、点击「成立」时）。
  cost: 1000
  # 初始赠地区块总额度（含政厅所在块），剩余额度在地图中自行选择。
  free-claim-count: 9
  # 兼容旧配置：未配置 free-claim-count 时按该半径计算总额度，不再自动圈 3×3。
  free-claim-radius: 1

claim:
  # 允许圈地的世界名列表；留空 = 所有世界都允许。
  worlds: []
  # 斜角相邻是否算「相连」。
  diagonal-connected: false
  # 每个小镇最多拥有的地块总数（含成立赠送）；0 = 不限。
  max-chunks: 256

expansion:
  # 扩张购买价格（每次 1 个区块）。
  price-per-chunk: 50

plots:
  max-area: 65536
  max-per-town: 256
  proposal-seconds: 120

# ---------------------------- 镇政厅 ----------------------------
townhall:
  # CraftEngine 自定义物品 id（如 mypack:town_hall）；留空或 CE 未装/物品不存在时
  # CE 未安装时回落到下面的原版材质；CE 已安装且配置了 id 时必须成功放置真实自定义方块。
  craftengine-id: "town:town_hall"
  # 原版回落材质（也是落地方块）。
  fallback-material: LODESTONE

# ---------------------------- 领地保护 ----------------------------
protection:
  break: true          # 禁止 outsiders 破坏方块
  place: true          # 禁止 outsiders 放置方块
  container: true      # 禁止 outsiders 打开容器（箱子/木桶/潜影盒/矿车箱等）
  interact: true       # 禁止 outsiders 交互方块（门/按钮/拉杆/工作台/铁砧等）
  bucket: true         # 禁止 outsiders 使用桶
  explosion: true      # 爆炸不伤及领地方块
  piston: true         # 活塞不得跨领地边界推拉
  fire: true           # 火焰不蔓延进领地
  hanging: true        # 画/展示框/盔甲架的放置与破坏
  entity-grief: true   # 末影人搬方块、恶魂/凋灵等实体破坏

# ---------------------------- 领地 buff ----------------------------
# 对身处小镇领地内的成员周期施加的药水效果。
# duration-seconds: -1 = 永久；购买后立即生效（可叠加时长）。
# type 为 Bukkit PotionEffectType 枚举名（如 HASTE / SPEED / REGENERATION / NIGHT_VISION）。
# amplifier: 0 = 一级。
buffs:
  # 效果施加刷新间隔（tick）；效果时长会自动设为间隔的 2 倍以平滑进出。
  apply-interval-ticks: 40
  entries:
    - id: haste
      display: "<green>祝福·急迫"
      cost: 500
      duration-seconds: 3600
      effects:
        - { type: HASTE, amplifier: 0 }
    - id: regen
      display: "<light_purple>祝福·再生"
      cost: 800
      duration-seconds: 1800
      effects:
        - { type: REGENERATION, amplifier: 0 }
    - id: glow
      display: "<aqua>祝福·辉光"
      cost: 200
      duration-seconds: -1
      effects:
        - { type: GLOWING, amplifier: 0 }

# ---------------------------- 界面 ----------------------------
menu:
  # 主菜单（MainMenu）里小镇入口的排序值，越小越靠前。
  entry-order: 10

# ---------------------------- 消息 ----------------------------
# ---------------------------- 镇库与经营 ----------------------------
civic:
  policy-slots: 2
  max-policy-slots: 6
  discount-cap-percent: 70
  harvest-cap-percent: 50
  market-fee-percent: 5
  technologies:
    - { id: planning, name: 城镇规划, cost: 500, max-level: 5, effect: LAND_CAPACITY, value: 16 }
    - { id: archives, name: 政务档案, cost: 800, max-level: 4, effect: POLICY_SLOTS, value: 1 }
    - { id: logistics, name: 搬迁物流, cost: 600, max-level: 5, effect: MOVE_DISCOUNT, value: 5 }
  policies:
    - { id: harvest, name: 丰收协约, cost: 200, duration-seconds: 86400, scope: RESIDENTS, harvest-percent: 15 }
    - { id: builders, name: 工匠互助, cost: 250, duration-seconds: 86400, scope: RESIDENTS, potion: HASTE, amplifier: 0, move-discount-percent: 10 }
    - { id: commerce, name: 商业繁荣, cost: 300, duration-seconds: 86400, scope: ALL, trade-discount-percent: 20 }

