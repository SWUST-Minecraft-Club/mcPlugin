// ============================================================
// 仓库根构建脚本：所有插件（./Minecraft-26_3-plugin/<插件名>/）共用这里的配置。
// 单个插件只在自己的 build.gradle 里写差异部分（版本号、额外依赖）。
// ============================================================

plugins {
    // 在这里声明一次，下面的 subprojects 直接 apply，子工程不用再写版本号
    id 'xyz.jpenilla.run-paper' version '3.1.0' apply false
}

subprojects { pluginProject ->
    apply plugin: 'java'
    apply plugin: 'xyz.jpenilla.run-paper'

    group = 'com.example'

    // 产物命名规范：<项目名>-<游戏版本>-plugin-<项目版本>
    //   游戏版本 26.3 → mc26_3（点换成下划线）
    //   项目版本形如 Beta_0_1_0（测试期），出正式版后去掉 Beta
    // 版本号在各自插件的 build.gradle 里设置，这里只定死前半段。
    def gameTag = "mc${minecraftVersion.replace('.', '_')}"
    base {
        archivesName = "${project.name}-${gameTag}-plugin"
    }

    // 每次构建都把产物归档到仓库根的 ./release/<项目名>/：文件名带版本，不会互相覆盖，
    // 这样每个小改版的构建产物都能留档（./release/ 已提交进仓库）。
    // 测试插件（TestPlugin*）只是联调用的夹具，不算产品，不归档。
    tasks.register('archiveArtifact') {
        group = 'build'
        description = '把构建产物复制到 ./release/<项目名>/ 留档'
        def artifact = tasks.named('jar').flatMap { it.archiveFile }
        inputs.file(artifact)
        doLast {
            if (project.name.startsWith('TestPlugin')) {
                return
            }
            copy {
                from artifact
                into rootProject.file("release/${project.name}")
            }
            logger.lifecycle("已归档：${artifact.get().asFile.name} → ./release/${project.name}/")
        }
    }
    tasks.named('build') {
        finalizedBy 'archiveArtifact'
    }

    repositories {
        mavenCentral()
        maven {
            name = 'papermc'
            url = 'https://repo.papermc.io/repository/maven-public/'
        }
    }

    dependencies {
        // 运行期由服务端提供 Paper API，必须 compileOnly，否则会打进去造成类冲突
        compileOnly "io.papermc.paper:paper-api:${paperApiVersion}"
    }

    // 本机 JDK 不低于目标版本时直接用当前 JDK 编译（避免 Gradle fork 工具链 worker 进程，
    // 部分机器上会起不来）；只有本机 JDK 太旧时才启用 toolchain。
    def targetJava = targetJavaVersion.toInteger()
    if (JavaVersion.current().majorVersion.toInteger() < targetJava) {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(targetJava)
            }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = targetJava
    }

    // 打包时把 paper-plugin.yml 里的 ${version} 换成各自 build.gradle 里的 version。
    // 注意：子工程的 version 是在根脚本之后才设置的，所以这里必须延迟到执行期读取。
    tasks.named('processResources') {
        filteringCharset = 'UTF-8'
        inputs.property('version', providers.provider { pluginProject.version })
        filesMatching('paper-plugin.yml') {
            expand(version: pluginProject.version.toString())
        }
    }

    tasks.named('runServer') {
        // 测试服用的服务端版本
        minecraftVersion(project.minecraftVersion)
        // 所有插件共用仓库根目录下的 ./run/ 测试服（只下一份服务端、只生成一份世界）。
        // 共用目录时不要同时启动两个插件的 runServer（会抢同一个端口）。
        // 想让某个插件用独立目录，在它自己的 build.gradle 里写 runDirectory(file('run'))
        runDirectory(rootProject.file('run'))
        // 想固定服务端构建号时打开这行（构建号见 papermc.io/downloads/paper）
        // build(200)
    }
}

// ------------------------------------------------------------
// 根工程上的便捷任务
// ------------------------------------------------------------

tasks.register('build') {
    group = 'build'
    description = '构建 ./Minecraft-26_3-plugin/ 下的所有插件'
    dependsOn { subprojects.collect { "${it.path}:build" } }
}

tasks.register('clean') {
    group = 'build'
    description = '清理所有插件的构建产物'
    dependsOn { subprojects.collect { "${it.path}:clean" } }
}

tasks.register('listPlugins') {
    group = '插件管理'
    description = '列出所有插件及其打包 / 测试服命令'
    doLast {
        if (subprojects.isEmpty()) {
            println '还没有插件。用 ./gradlew newPlugin -PpluginName=MyPlugin 创建一个。'
            return
        }
        println '已注册的插件：'
        subprojects.sort { it.name }.each { p ->
            println "  ${p.name}  v${p.version}"
            println "      目录    ./Minecraft-26_3-plugin/${p.name}"
            println "      打包    ./gradlew ${p.path}:build"
            println "      测试服  ./gradlew ${p.path}:runServer"
        }
    }
}

// 按模板生成一个新插件：./gradlew newPlugin -PpluginName=MyPlugin [-PpackageName=com.example.myplugin]
tasks.register('newPlugin') {
    group = '插件管理'
    description = '复制模板生成新插件：./gradlew newPlugin -PpluginName=MyPlugin'
    doLast {
        // 模板放在 ./templates/plugin-template/，里面的占位符固定为 ExamplePlugin / exampleplugin
        def templateDir = rootProject.file('templates/plugin-template')
        def templateName = 'ExamplePlugin'
        def templateLower = 'exampleplugin'
        def templatePackage = 'com.example.exampleplugin'
        def pluginsDir = rootProject.file('Minecraft-26_3-plugin')

        def pluginName = (findProperty('pluginName') ?: '').toString().trim()
        if (!pluginName) {
            throw new GradleException('缺少插件名。用法：./gradlew newPlugin -PpluginName=MyPlugin')
        }
        if (!(pluginName ==~ /[A-Za-z][A-Za-z0-9_]*/)) {
            throw new GradleException("插件名只能由字母、数字、下划线组成且以字母开头：${pluginName}")
        }
        if (!templateDir.isDirectory()) {
            throw new GradleException("模板目录不存在：${templateDir}")
        }

        def lowerName = pluginName.toLowerCase(Locale.ROOT)
        def packageName = (findProperty('packageName') ?: "com.example.${lowerName}").toString().trim()
        if (!(packageName ==~ /[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+/)) {
            throw new GradleException("包名格式不合法：${packageName}")
        }

        def targetDir = new File(pluginsDir, pluginName)
        if (targetDir.exists()) {
            throw new GradleException("目标目录已存在：${targetDir}")
        }

        // 1) 复制模板，跳过构建产物和测试服目录
        copy {
            from templateDir
            into targetDir
            exclude 'build/**', 'run/**', '.gradle/**'
        }

        // 2) 替换文件内容（包名要整体先替换，避免被短名替换拆散）
        def replacements = [
                (templatePackage): packageName,
                (templateName)   : pluginName,
                (templateLower)  : lowerName,
        ]
        targetDir.eachFileRecurse { f ->
            if (f.isFile() && f.name ==~ /.*\.(java|yml|yaml|gradle|properties|md|txt|json)$/) {
                def text = f.getText('UTF-8')
                replacements.each { from, to -> text = text.replace(from, to) }
                f.setText(text, 'UTF-8')
            }
        }

        // 3) 重命名带模板名的文件（ExamplePlugin.java -> MyPlugin.java）
        def toRename = []
        targetDir.eachFileRecurse { f ->
            if (f.isFile() && f.name.contains(templateName)) {
                toRename << f
            }
        }
        toRename.each { f ->
            f.renameTo(new File(f.parentFile, f.name.replace(templateName, pluginName)))
        }

        // 4) 把包目录搬到新包名对应的路径
        def javaRoot = new File(targetDir, 'src/main/java')
        def oldPkgDir = new File(javaRoot, templatePackage.replace('.', '/'))
        def newPkgDir = new File(javaRoot, packageName.replace('.', '/'))
        if (oldPkgDir.isDirectory() && oldPkgDir != newPkgDir) {
            newPkgDir.parentFile.mkdirs()
            if (!oldPkgDir.renameTo(newPkgDir)) {
                copy {
                    from oldPkgDir
                    into newPkgDir
                }
                delete oldPkgDir
            }
            // 清掉搬空后的旧包目录（只删空目录，不动其它东西）
            def pkgParts = templatePackage.split('\\.')
            for (int i = pkgParts.length; i > 0; i--) {
                def d = new File(javaRoot, pkgParts[0..<i].join('/'))
                if (d.isDirectory() && d.listFiles()?.length == 0) {
                    delete d
                }
            }
        }

        println("""
        |已创建插件 ${pluginName}
        |  目录    ./Minecraft-26_3-plugin/${pluginName}
        |  包名    ${packageName}
        |  打包    ./gradlew :${pluginName}:build
        |  测试服  ./gradlew :${pluginName}:runServer
        |下一步：填一下 paper-plugin.yml 里的 authors / website，然后开始写代码。
        """.stripMargin())
    }
}
