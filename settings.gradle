plugins {
    // 本机缺少目标 JDK 时，Gradle 会自动下载对应版本的工具链
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'Minecraft-26_3-plugins'

// 插件都放在 Minecraft-26_3-plugin/<插件名>/ 下。
// 这里自动把该目录里每个含 build.gradle 的子目录注册成 Gradle 子工程，
// 因此新增插件只需要新建目录（或用 ./gradlew newPlugin -PpluginName=xxx 生成），
// 不需要回来改这个文件。
def pluginsDir = file('Minecraft-26_3-plugin')
if (pluginsDir.isDirectory()) {
    pluginsDir.listFiles()
            .findAll { it.isDirectory() && !it.name.startsWith('.') }
            .sort { it.name }
            .each { dir ->
                if (new File(dir, 'build.gradle').exists()) {
                    include dir.name
                    // 让工程名等于插件名，目录结构保持 Minecraft-26_3-plugin/<插件名>
                    project(":${dir.name}").projectDir = dir
                } else {
                    logger.lifecycle("[settings] 跳过 ${dir.name}：目录里没有 build.gradle，未注册为插件工程")
                }
            }
}
