# Paper 插件描述文件（26.3 起推荐使用 paper-plugin.yml）
# 注意：Paper 插件不在 yml 中声明命令，命令通过代码里的 LifecycleEvents.COMMANDS 注册
name: ExamplePlugin
version: '${version}'
main: com.example.exampleplugin.ExamplePlugin
api-version: '26.3'
description: Minecraft 26.3 (Paper) 插件开发模板
authors: [zhou-BZDDX]
website: https://github.com/zhou-BZDDX/mcPligin

# 权限声明；default 可取 true / false / op / not_op
permissions:
  exampleplugin.hello:
    description: 允许使用 /hello
    default: true
  exampleplugin.admin:
    description: 允许使用 /mcplugin
    default: op
  exampleplugin.reload:
    description: 允许使用 /mcplugin reload
    default: op
