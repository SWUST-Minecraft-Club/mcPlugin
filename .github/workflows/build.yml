name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 仓库里的 wrapper 默认指向国内镜像，CI 上换回官方地址
      - name: Use official Gradle distribution
        run: sed -i 's#mirrors.huaweicloud.com/gradle/#services.gradle.org/distributions/#' ./gradle/wrapper/gradle-wrapper.properties

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      # 根工程的 build 会构建 ./Minecraft-26_3-plugin/ 下的所有插件
      - name: Build all plugins
        run: ./gradlew build --no-daemon --stacktrace

      # Fabric 客户端模组是独立工程（不依赖 fabric-loom，只下载官方客户端 jar）
      - name: Install native UI build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libfreetype6-dev

      - name: Build Fabric mods
        run: |
          for project in ./fabric-26_3-mod/*/; do
            if [ -f "${project}build.gradle" ]; then
              ./gradlew -p "$project" build --no-daemon --stacktrace
            fi
          done

      - name: Package MainMenu and Wallet ZIP
        run: python3 ./scripts/package-mainmenu-wallet.py --artifacts build --output ./build/delivery/MainMenu-Wallet-Vault-mc26_3.zip

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v7
        with:
          name: MainMenu-Wallet-Vault-mc26_3
          path: |
            ./build/delivery/*.zip
            ./build/delivery/*.zip.sha256
          if-no-files-found: error

      - name: Upload plugin jars
        uses: actions/upload-artifact@v7
        with:
          name: plugin-jars
          path: |
            ./Minecraft-26_3-plugin/*/build/libs/*.jar
            !./Minecraft-26_3-plugin/TestPlugin*/build/libs/*.jar
          if-no-files-found: error

      - name: Upload mod jar
        uses: actions/upload-artifact@v7
        with:
          name: mod-jar
          path: ./fabric-26_3-mod/*/build/libs/*.jar
          if-no-files-found: error
