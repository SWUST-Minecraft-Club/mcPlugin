name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 仓库里的 wrapper 默认指向国内镜像，CI 上换回官方地址
      - name: Use official Gradle distribution
        run: sed -i 's#mirrors.huaweicloud.com/gradle/#services.gradle.org/distributions/#' ./gradle/wrapper/gradle-wrapper.properties

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build all plugins
        run: ./gradlew build --no-daemon --stacktrace

      - name: Build Fabric mod
        run: ./gradlew -p ./fabric-26_3-mod/MainMenuRepair build --no-daemon --stacktrace

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 收集插件与模组产物；没有 jar 时也不报错。
          # 测试插件（./Minecraft-26_3-plugin/TestPlugin*）只用于本地联调，不随 Release 发布。
          shopt -s nullglob
          assets=()
          for jar in ./Minecraft-26_3-plugin/*/build/libs/*.jar ./fabric-26_3-mod/*/build/libs/*.jar; do
            case "$jar" in
              */TestPlugin*) continue ;;
            esac
            assets+=("$jar")
          done
          echo "将上传 ${#assets[@]} 个 jar"
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --title "$GITHUB_REF_NAME" --generate-notes
