plugins {
	id 'java'
}

// 为什么不用 fabric-loom：
//   26.3 客户端不再混淆，Fabric 也没有 26.3 的 yarn/intermediary —— 编译不需要 mappings，构建也不需要 remap。
//   而 maven.fabricmc.net 在部分网络环境下会被限速到 KB 级（Loom 自身依赖很多，会卡在下载上），
//   所以这里直接手工编译：编译期只需要「官方客户端 jar」+「注解桩」，
//   后者用 src/mixin-stubs/java 里的同名注解桩（Mixin 注解、Fabric API 与 Loader 的少量接口），
//   不引入任何外部依赖。

group = project.group
version = project.version

base {
	archivesName = project.archives_base_name
}

// 不声明 Java toolchain：直接用当前 JDK 编译（避免 Gradle fork worker daemon，部分机器上会起不来），
// 字节码版本由下面的 options.release = 25 保证。

def clientJar = layout.buildDirectory.file("minecraft/client-${project.minecraft_version}.jar")

// 注解桩：单独 sourceSet，只参与编译，不打进模组 jar
sourceSets {
	mixinStubs {
		java.srcDir 'src/mixin-stubs/java'
		// 桩里引用了 Minecraft 类（例如 ScreenEvents.AfterInit 的参数类型），所以需要客户端 jar
		compileClasspath = files(clientJar)
		runtimeClasspath = files()
	}
}

// 下载官方客户端 jar（26.3）
// 版本号与地址在配置期取好：执行期访问 project 在 Gradle 9 已弃用、Gradle 10 会直接报错
def minecraftVersion = project.minecraft_version
def clientJarUrl = project.client_jar_url
tasks.register('downloadMinecraftClient') {
	def target = clientJar.get().asFile
	outputs.file(target)
	outputs.upToDateWhen { target.exists() && target.length() > 10_000_000L }
	doLast {
		target.parentFile.mkdirs()
		logger.lifecycle("下载 Minecraft ${minecraftVersion} 客户端 jar ...")
		java.net.URI.create(clientJarUrl).toURL().withInputStream { input ->
			target.withOutputStream { output -> output << input }
		}
		logger.lifecycle("已下载：${target}（${target.length()} 字节）")
	}
}

dependencies {
	// 官方客户端 jar：26.3 未混淆，可直接作为编译依赖
	compileOnly files(clientJar)
	// 注解桩（Mixin / Fabric API / Loader）
	compileOnly sourceSets.mixinStubs.output
}

tasks.named('compileMixinStubsJava') {
	dependsOn 'downloadMinecraftClient'
	options.encoding = 'UTF-8'
	options.release = 25
}

tasks.named('compileJava') {
	dependsOn 'downloadMinecraftClient', 'compileMixinStubsJava'
	options.encoding = 'UTF-8'
	options.release = 25
}

processResources {
	def modVersion = project.version
	inputs.property 'version', modVersion
	filesMatching('fabric.mod.json') {
		expand 'version': modVersion
	}
}

// 每次构建都把产物归档到仓库根的 ./release/<项目名>/（文件名带版本，不会互相覆盖）
// 目录与项目名在配置期取好：执行期访问 project 在 Gradle 9 已弃用、Gradle 10 会直接报错
def projectName = project.name
def releaseDir = file("../../release/${projectName}")
tasks.register('archiveArtifact') {
	group = 'build'
	description = '把构建产物复制到仓库根 ./release/<项目名>/ 留档'
	def artifact = tasks.named('jar').flatMap { it.archiveFile }
	inputs.file(artifact)
	doLast {
		def source = artifact.get().asFile
		if (!releaseDir.isDirectory() && !releaseDir.mkdirs()) {
			throw new GradleException("无法创建归档目录：${releaseDir}")
		}
		java.nio.file.Files.copy(source.toPath(),
				new File(releaseDir, source.name).toPath(),
				java.nio.file.StandardCopyOption.REPLACE_EXISTING)
		logger.lifecycle("已归档：${source.name} → ./release/${projectName}/")
	}
}

tasks.named('build') {
	finalizedBy 'archiveArtifact'
}
