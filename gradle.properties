# ===== 版本配置（升级 Minecraft 版本时主要改这里）=====
# Folia 服务端 / API 对应的 Minecraft 版本
minecraftVersion=26.3
# Folia API 构件版本，格式为 <mc版本>.build.<构建号>-<通道>
# 可用构建列表：https://repo.papermc.io/repository/maven-public/dev/folia/folia-api/
# 26.3 目前只有 alpha 构建（build 3~5），固定到 build 5 保证产物可复现
foliaApiVersion=26.3.build.5-alpha
# 编译目标 Java 版本，必须 >= 服务端要求的最低 Java 版本（Folia 26.3 要求 Java 25）
targetJavaVersion=25

# ===== Gradle =====
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
